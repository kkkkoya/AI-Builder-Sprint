<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body class="fade-in">

    <!-- 📱 스플래시 스크린 -->
    <div id="splash-screen" class="hidden">
        <!-- index.html과 동일한 이미지 기반 스플래시로 업데이트 -->
        <div class="splash-logo-container-transition">
            <!-- 화면 전환 시 그림: 크기 확대를 위해 클래스 변경 -->
            <img class="brand-logo-transition" src="eobom.png">
        </div>
    </div>

    <!-- 📱 마이페이지 전용 전체 상단 헤더 (화면 위 양 옆 고정) -->
    <header class="global-top-header">
        <button id="mypage-back-btn" class="button header-close-btn">< 닫기</button>
        <div>
            <!-- 기본 화면 로고: 크기 조정을 위해 클래스 변경 (텍스트 대신 이미지 사용) -->
            <img class="brand-logo-content" src="eobom(nowriting).png">
        </div>
    </header>

    <main class="container">
        <div class="card-box mypage-card">
            <!-- 사용자 인적사항 요약 카드 -->
            <div class="profile-info-header">
                <!-- 기본 화면 아바타: 크기 조정을 위해 클래스 변경 -->
                <span id="profile-user-avatar" class="avatar-large-content">👤</span>
                <h2 id="profile-user-name">사용자 이름</h2>
                <p id="profile-user-detail" class="mypage-sub">인적사항 정보가 들어갑니다.</p>
            </div>

            <hr class="divider">

            <!-- 활동 기록 영역 -->
            <!-- mypage.html의 <div id="history-scroll-container"> 내부를 아래 코드로 통째로 교체하세요 -->
            <!-- 활동 기록 영역 -->
            <div id="history-scroll-container" class="history-scroll-box">
                <div id="pregnant-history-view" class="history-list hidden">
                    <h3>나의 고민과 받은 지혜</h3>
                    <div id="pregnant-empty-state" class="empty-state"><p>아직 남긴 고민이 없어요.</p></div>
                    <div id="pregnant-history-item" class="history-item hidden">
                        <p id="mypage-user-concern" class="item-content"></p>
                        <div class="matched-answer-box hidden">
                            <p class="mentor-label"></p>
                            <div class="audio-container hidden"><audio controls></audio></div>
                            <div class="answer-content-box"><p class="answer-text"></p></div>
                        </div>
                    </div>
                </div>
                <div id="senior-history-view" class="history-list hidden">
                    <h3>내가 전달한 지혜</h3>
                    <div id="senior-empty-state" class="empty-state"><p>아직 전달된 경험이 없어요.</p></div>
                    <div id="senior-history-item" class="history-item hidden">
                        <div class="summary-box"><strong>답변한 고민:</strong> <span id="mypage-answered-summary"></span></div>
                        <div class="audio-container hidden"><audio controls></audio></div>
                        <div class="stt-content-box"><p id="mypage-stt-text" class="stt-text"></p></div>
                        <div class="received-reaction-box"><p class="reaction-title">감사 메시지</p><p class="reaction-text" id="senior-received-reaction">감사 메시지가 도착하면 이곳에서 확인할 수 있어요.</p></div>
                    </div>
                </div>
            </div>

            <hr class="divider">

            <!-- 최하단 로그아웃 버튼 -->
            <button id="logout-btn" class="button auth-btn logout-style mypage-logout-btn">로그아웃</button>
        </div>
    </main>

<script type="module" src="ui.js"></script></body>
</html>
