<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임산부 모드</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body class="fade-in">

    <header class="global-top-header">
        <!-- 👈 왼쪽: 뒤로가기 버튼 -->
        <button class="button header-close-btn" onclick="window.location.href='index.html'">< 뒤로가기</button>
        
        <!-- 👉 오른쪽: 로고 (및 프로필 버튼) -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img class="brand-logo-content" src="eobom(nowriting).png">
            <button id="main-profile-btn" class="profile-top-btn hidden">👤 프로필</button>
        </div>
    </header>

    <main class="container">
        <!-- 1단계: 고민 작성하기 (B용 ID 덧붙임) -->
        <section id="step1-section" class="card-box">
            <div id="concernInputSection" style="width:100%">
                <div class="baby-welcome-header">
                    <!-- 기본 화면 일러스트/아이콘: 크기 조정을 위해 클래스 변경 -->
                    <span class="illustration-icon-content">👶🏻</span>
                    <h1>어떤 마음이 들고 계시나요?<br>당신의 고민을 들려주세요.</h1>
                </div>
                <textarea id="pregnancy-input" class="info-textarea"></textarea>
                <!-- B용 ID 덧붙임 -->
                <textarea id="concernInput" style="display:none;"></textarea>
                <button id="submit-question-btn" class="button primary-btn">내 고민 전달하기</button>
                <button id="concernSubmitButton" style="display:none;"></button>
            </div>
        </section>

        <!-- 2-A단계: AI 고민 분석 로딩 -->
        <section id="ai-analyzing-loading" class="card-box hidden">
            <div id="aiProgressSection">
                <div class="spinner"></div>
                <p id="aiProgressText" class="loading-text">AI가 고민을 분석하고,<br>어르신의 경험 아카이브에서 지혜를 찾고 있습니다...</p>
            </div>
        </section>

        <!-- 2-B(추가): B용 추가질문 영역 (초기 숨김) -->
        <section id="clarificationSection" class="card-box hidden">
            <p id="clarificationQuestion" class="index-subtext">조금 더 구체적인 상황을 알려주시면 잘 맞는 지혜를 찾을 수 있어요.</p>
            <textarea id="clarificationInput"></textarea>
            <button id="clarificationSubmitButton" class="button primary-btn">답변 보내기</button>
        </section>

        <!-- 2-C단계: 추천 경험 카드 목록 -->
        <section id="recommended-card-section" class="card-box hidden">
            <h2>고민과 관련된 지혜로운 경험들</h2>
            <div id="issue-tags" class="tag-group"></div>

            <!-- B용 분석결과 덧붙임 -->

            <div id="experience-card-list" class="experience-card-list"></div>
        </section>

        <!-- 3단계 & 4단계: 편지 읽기 & 감사 전달 -->
        <section id="letter-detail-section" class="card-box hidden">
            <button id="reset-btn" class="button back-btn">✏️ 다른 고민 다시 적기</button>

            <!-- B용 매칭 결과 덧붙임 -->

            <div class="mentor-header"><h2 id="letter-mentor-title"></h2><div id="letter-tags" class="tag-group"></div></div>

            <div id="letter-audio-container" class="audio-container hidden"><audio id="audio-player" controls></audio></div>
            <div id="receivedLetterSection" style="width:100%">
                <div id="ai-letter-content" class="letter-box"><p id="receivedLetterText"></p></div>

                <div id="safety-notice-box" class="notice-box">
                    <div id="receivedSafetyNotice"></div>
                </div>

                <hr class="divider">

                <section id="thank-section">
                    <h3>어르신의 경험이 도움이 되셨나요?<br>따뜻한 마음을 전해보세요.</h3>
                    <div class="thank-btn-group">
                        <button class="button thank-btn feedbackButton" data-reaction="마음이 편해졌어요" data-type="1">마음이 편해졌어요 😌</button>
                        <button class="button thank-btn feedbackButton" data-reaction="용기를 얻었어요" data-type="2">큰 용기를 얻었어요 💪</button>
                        <button class="button thank-btn feedbackButton" data-reaction="혼자가 아닌 것 같아요" data-type="3">혼자가 아니라는 생각이 들어요 🤝</button>
                    </div>

                    <div id="thank-complete-msg" class="complete-msg hidden">
                        <p>✨ 감사 메시지가 어르신께 전달되었습니다.<br>당신의 내일을 <strong>이어봄</strong>이 응원합니다.</p>
                        <button id="pregnant-home-complete-btn" class="button secondary-btn mt-10">‹ 처음으로 돌아가기</button>
                    </div>
                </section>
            </div>
        </section>

        <div id="customAlertModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <p>고민 내용을 적어주세요!</p>
                <button id="closeModalBtn">확인</button>
            </div>
        </div>

    </main>

<script type="module" src="ui.js"></script></body>
</html>
