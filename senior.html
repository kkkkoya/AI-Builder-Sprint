<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어르신 모드</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body class="fade-in senior-page">

    <header class="global-top-header">
        <!-- 👈 왼쪽: 뒤로가기 버튼 -->
        <button class="button header-close-btn" onclick="window.location.href='index.html'">< 뒤로가기</button>
        
        <!-- 👉 오른쪽: 로고 (및 프로필 버튼) -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img class="brand-logo-content" src="eobom(nowriting).png">
            <button id="main-profile-btn" class="profile-top-btn hidden">👤 프로필</button>
        </div>
    </header>

    <main class="container">
        <!-- 1단계: 도착한 질문 카드 -->
        <section id="question-section" class="card-box senior-card">
            <div id="mentorQuestionSection"><span class="question-badge">도착한 고민</span><p id="mentor-empty-state" class="empty-sub">아직 도착한 질문이 없어요.<br>도착한 질문이 있으면 알려드릴게요.</p><h2 id="mentorQuestionText" class="senior-question-title hidden"></h2></div>
        </section>

        <!-- 2단계: 음성 녹음 영역 (원형 대형 마이크 버튼 복원) -->
        <section id="record-section" class="card-box senior-card">
            <div id="recordingSection" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <p id="record-guide-text" class="senior-guide">
                    아래 <strong>마이크 버튼</strong>을 누르고<br>천천히 말씀해 주세요.
                </p>

                <!-- 원본 원형 마이크 버튼에 B용 ID 연결 -->
                <button id="mic-btn" class="senior-mic-btn" aria-label="음성 녹음 시작">
                    <!-- 기본 화면 아이콘: 크기 조정을 위해 클래스 변경 -->
                    <span class="icon-mic-content">🎙️</span>
                    <span id="mic-btn-label">말씀 시작하기</span>
                </button>
                <button id="recordButton" style="display:none;"></button>
                <button id="stopRecordButton" style="display:none;"></button>

                <div id="recording-status" class="status-text hidden">
                    <span class="pulse-dot"></span> <span id="recordingStatus">편하게 말씀을 듣고 있어요...</span>
                </div>

                <div id="stt-result-box" class="senior-stt-box hidden">
                    <div id="transcriptSection">
                        <p class="stt-title">🗣️ 말씀하신 내용:</p>
                        <textarea id="transcriptInput" class="stt-content" style="width:100%; border:none; resize:none;"></textarea>
                    </div>
                </div>

                <div id="mentor-answer-guidance" class="notice-box hidden" role="alert">
                    도착한 고민과 관련된 실제 경험으로 확인하기 어려워요.<br>
                    비슷한 일을 겪었던 상황과 당시의 마음을 조금 더 들려주세요.
                </div>
                <div id="mentor-temporary-notice" class="notice-box hidden" role="alert"></div>

                <button id="send-experience-btn" class="button senior-action-btn hidden">🎁 이 경험 전달하기</button>
                <button id="retry-mentor-processing-btn" class="button senior-action-btn hidden">다시 정리하기</button>
                <button id="mentorAnswerSubmitButton" style="display:none;"></button>
            </div>
        </section>

        <!-- 3단계: AI 정리 결과 확인 후 최종 전달 -->
        <section id="letterResultSection" class="card-box senior-card hidden">
            <h2>경험 정리 완료</h2>
            <h3 id="experienceResultTitle"></h3>
            <p id="experienceResultSummary" class="senior-guide"></p>
            <div class="experience-keyword-section">
                <p class="experience-keyword-label">경험 키워드</p>
                <div id="experienceTags" class="experience-keyword-list" aria-label="경험 키워드"></div>
            </div>
            <h3>편지로 정리된 내용</h3>
            <p id="letterText" class="senior-guide"></p>
            <details>
                <summary>AI가 정리한 부분 보기</summary>
                <ul id="editList"></ul>
                <div id="safetyBox"></div>
            </details>
            <button id="edit-mentor-result-btn" class="button secondary-btn">내용 수정하기</button>
            <button id="finalize-mentor-result-btn" class="button senior-action-btn">최종 전달하기</button>
        </section>

        <!-- 4단계: 감사 메시지 결과 화면 -->
        <section id="thank-you-section" class="card-box senior-card hidden">
            <div id="impactSection">
                <div class="thank-icon">💌</div>
                <h2 id="impactMessage" class="senior-thank-title"></h2>
                <div class="senior-thank-box"><p id="impact-empty-state">감사 메시지가 도착하면 이곳에서 확인할 수 있어요.</p></div>
            </div>

            <button id="senior-reset-btn" class="button secondary-btn">
                🔄 다른 이야기 또 들려주기
            </button>
            <button id="senior-home-complete-btn" class="button secondary-btn">
                ‹ 처음으로 돌아가기
            </button>
        </section>
    </main>

<script type="module" src="ui.js"></script></body>
</html>
