<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이어봄 - 어르신 모드</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body class="fade-in">

    <main class="container">
        <!-- 1단계: 도착한 질문 카드 -->
        <section id="question-section" class="card-box senior-card">
            <span class="question-badge">💡 도착한 임산부의 고민</span>
            <h2 id="senior-question-text" class="senior-question-title">
                "처음 엄마가 되었을 때 혼자 모든 것을 감당해야 할 것 같아 두려웠던 경험이 있다면 들려주세요."
            </h2>
        </section>

        <!-- 2단계: 음성 녹음 인터랙션 영역 -->
        <section id="record-section" class="card-box senior-card">
            <p id="record-guide-text" class="senior-guide">
                아래 <strong>마이크 버튼</strong>을 누르고<br>천천히 말씀해 주세요.
            </p>

            <button id="mic-btn" class="senior-mic-btn" aria-label="음성 녹음 시작">
                <span class="mic-icon">🎙️</span>
                <span id="mic-btn-label">말씀 시작하기</span>
            </button>

            <div id="recording-status" class="status-text hidden">
                <span class="pulse-dot"></span> <span id="status-label">편하게 말씀을 듣고 있어요...</span>
            </div>

            <div id="stt-result-box" class="senior-stt-box hidden">
                <p class="stt-title">🗣️ 말씀하신 내용:</p>
                <p id="stt-text-content" class="stt-content">
                    "첫애를 가졌을 때 나도 참 무서웠지. 남편은 일하느라 바쁘고 혼자 밤에 울기도 많이 울었어. 그래도 아이 얼굴 보면 힘이 생기더라고..."
                </p>
            </div>

            <button id="send-experience-btn" class="button senior-action-btn hidden">
                🎁 이 경험 전달하기
            </button>
        </section>

        <!-- 3단계: 감사 메시지 결과 화면 -->
        <section id="thank-you-section" class="card-box senior-card hidden">
            <div class="thank-icon">💌</div>
            <h2 class="senior-thank-title">마음이 따뜻하게 잘 전달되었습니다</h2>
            <div class="senior-thank-box">
                <p>
                    "당신의 경험 덕분에 한 산모가 출산에 대한 두려움을 덜었습니다.<br><br>
                    지혜롭고 따뜻한 말씀에 깊이 감사드립니다."
                </p>
            </div>
            <button id="senior-reset-btn" class="button secondary-btn" style="font-size: 18px; padding: 16px 24px;">
                🔄 다른 이야기 또 들려주기
            </button>
        </section>
    </main>

    <script src="ui.js"></script>
</body>
</html>
