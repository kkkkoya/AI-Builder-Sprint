<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어르신 모드</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body class="fade-in">

    <header class="global-top-header">
        <!-- 👈 왼쪽: 뒤로가기 버튼 -->
        <button class="button header-close-btn" onclick="window.location.href='index.html'">‹ 뒤로가기</button>
        
        <!-- 👉 오른쪽: 로고 (및 프로필 버튼) -->
        <div style="display: flex; align-items: center; gap: 12px;">
            <img class="brand-logo-content" src="이어봄(글자없).png">
            <button id="main-profile-btn" class="profile-top-btn hidden">👤 프로필</button>
        </div>
    </header>

    <main class="container">
        <!-- 1단계: 도착한 질문 카드 -->
        <section id="question-section" class="card-box senior-card">
            <div id="mentorQuestionSection">
                <span class="question-badge">💡 도착한 임산부의 고민</span>
                <h2 id="mentorQuestionText" class="senior-question-title">
                    "처음 엄마가 되었을 때 혼자 모든 것을 감당해야 할 것 같아 두려웠던 경험이 있다면 들려주세요."
                </h2>
            </div>
        </section>

        <!-- 2단계: 음성 녹음 영역 (원형 대형 마이크 버튼 복원) -->
        <section id="record-section" class="card-box senior-card">
            <div id="recordingSection" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <p id="record-guide-text" class="senior-guide">
                    아래 <strong>마이크 버튼</strong>을 누르고<br>천천히 말씀해 주세요.
                </p>

                <!-- 원본 원형 마이크 버튼에 B용 ID 연결 -->
                <button id="mic-btn" class="senior-mic-btn" aria-label="음성 녹음 시작">
                    <!-- 기본 화면 아이콘: 크기 조정을 위해 클래스 변경 -->
                    <span class="icon-mic-content">🎙️</span>
                    <span id="mic-btn-label">말씀 시작하기</span>
                </button>
                <button id="recordButton" style="display:none;"></button>
                <button id="stopRecordButton" style="display:none;"></button>

                <div id="recording-status" class="status-text hidden">
                    <span class="pulse-dot"></span> <span id="recordingStatus">편하게 말씀을 듣고 있어요...</span>
                </div>

                <div id="stt-result-box" class="senior-stt-box hidden">
                    <div id="transcriptSection">
                        <p class="stt-title">🗣️ 말씀하신 내용:</p>
                        <textarea id="transcriptInput" class="stt-content" style="width:100%; border:none; resize:none;">"첫애를 가졌을 때 나도 참 무서웠지. 남편은 일하느라 바쁘고 혼자 밤에 울기도 많이 울었어. 그래도 아이 얼굴 보면 힘이 생기더라고..."</textarea>
                    </div>
                </div>

                <button id="send-experience-btn" class="button senior-action-btn hidden">🎁 이 경험 전달하기</button>
                <button id="mentorAnswerSubmitButton" style="display:none;"></button>
            </div>
        </section>

        <!-- 3단계(추가): B용 AI 편지 결과 & 이어짐 기록 (기본 숨김) -->
        <section id="letterResultSection" class="card-box senior-card hidden">
            <p id="letterText" class="senior-guide"></p>
            <ul id="editList"></ul>
            <div id="experienceTags"></div>
            <div id="safetyBox"></div>
        </section>

        <!-- 4단계: 감사 메시지 결과 화면 -->
        <section id="thank-you-section" class="card-box senior-card hidden">
            <div id="impactSection">
                <div class="thank-icon">💌</div>
                <h2 id="impactMessage" class="senior-thank-title">마음이 따뜻하게 잘 전달되었습니다</h2>
                <div class="senior-thank-box">
                    <p>
                        "당신의 경험 덕분에 한 산모가 출산에 대한 두려움을 덜었습니다.<br><br>
                        지혜롭고 따뜻한 말씀에 깊이 감사드립니다."
                    </p>
                    <p id="helpedCount" style="display:none;"></p>
                    <p id="thanksCount" style="display:none;"></p>
                </div>
            </div>

            <button id="senior-reset-btn" class="button secondary-btn" style="font-size: 18px; padding: 16px 24px;">
                🔄 다른 이야기 또 들려주기
            </button>
            <button id="senior-home-complete-btn" class="button secondary-btn" style="font-size: 16px; padding: 14px 20px;">
                ‹ 처음으로 돌아가기
            </button>
        </section>
    </main>

    <script type="module" src="ui.js"></script>
</body>
</html>
